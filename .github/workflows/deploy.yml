# Деплой на VPS по SSH после успешного CI на ветке master (только push, не PR).
# Секреты GitHub: см. deploy/GITHUB_ACTIONS_SSH.md

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Require deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e
          ok=0
          [ -n "$DEPLOY_HOST" ] || { echo "::error::Секрет DEPLOY_HOST пустой или не задан (Settings → Secrets → Actions)"; ok=1; }
          [ -n "$DEPLOY_USER" ] || { echo "::error::Секрет DEPLOY_USER пустой или не задан"; ok=1; }
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "::error::Секрет DEPLOY_SSH_KEY пустой или не задан"; ok=1; }
          [ -n "$DEPLOY_PATH" ] || { echo "::error::Секрет DEPLOY_PATH пустой или не задан"; ok=1; }
          exit "$ok"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 2m
          command_timeout: 30m
          debug: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin
            git reset --hard origin/master
            RELEASE="$(git rev-parse --short HEAD)"
            docker compose build --build-arg "RELEASE=${RELEASE}" app
            docker compose up -d
