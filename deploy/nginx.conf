# Nginx reverse proxy config for vietradar.com
# After placing this file: sudo ln -s /etc/nginx/sites-available/vietradar /etc/nginx/sites-enabled/
# Get SSL cert: sudo certbot --nginx -d vietradar.com -d www.vietradar.com
#
# Note: nhatrang.guide убран из конфига — у домена нет DNS-записей (NXDOMAIN),
# поэтому редиректы с него бесполезны. Если вернёте DNS — добавим server_name
# и выпустим cert командой: certbot --expand --nginx -d vietradar.com -d www.vietradar.com -d nhatrang.guide -d www.nhatrang.guide

# HTTP: ACME challenge + redirect to HTTPS canonical
server {
    listen 80;
    server_name vietradar.com www.vietradar.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://vietradar.com$request_uri;
    }
}

# HTTPS: www → apex
server {
    listen 443 ssl http2;
    server_name www.vietradar.com;

    ssl_certificate     /etc/letsencrypt/live/vietradar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vietradar.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://vietradar.com$request_uri;
}

# HTTPS: main app
server {
    listen 443 ssl http2;
    server_name vietradar.com;

    ssl_certificate     /etc/letsencrypt/live/vietradar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vietradar.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Static Next.js assets — long cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # All other requests → Next.js app
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
